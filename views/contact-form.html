<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="icon" href="images/favicon.svg">
  <link rel="stylesheet" href="styles/contact-form.css">
</head>
<body>
  <form action="#" method="get">
    <div id="title-group">
      <h1>Contact Form</h1>
    </div>

    <div id="first-name-group">
      <label for="first-name">First Name</label>
      <input type="text" id="first-name" name="first-name">
    </div>

    <div id="last-name-group">
      <label for="last-name">Last Name</label>
      <input type="text" id="last-name" name="last-name">
    </div>

    <div id="job-title-group">
      <label for="job-title">Job Title</label>
      <input type="text" id="job-title" name="job-title">
    </div>

    <div id="company-group">
      <label for="company">Company</label>
      <input type="text" id="company" name="company">
    </div>

    <div id="linkedin-group">
      <label for="linkedin">LinkedIn URL</label>
      <input type="url" id="linkedin" name="linkedin">
    </div>

    <div id="email-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email">
    </div>

    <div id="first-contact-method-group">
      <label for="first-contact-method">How did we meet?</label>
      <select name="first-contact-method" id="first-contact-method">
        <option value="">Please select</option>
        <option value="in-person">In Person</option>
        <option value="personal-website">Personal Website</option>
        <option value="linkedin">LinkedIn</option>
      </select>
    </div>

    <div id="other-contact-method-group">      
      <label for="other-contact-method">Other (please specify)</label>
      <input type="text" id="other-contact-method" name="other-contact-method">
    </div>

    <div id="message-group">
      <label for="message">Message</label>
      <textarea id="message" name="message"></textarea>
    </div>

    <div id="mailing-list-group">      
      <input type="checkbox" id="mailing-list" name="mailing-list">
      <label for="mailing-list">Please add me to your mailing list</label>
    </div>

    <div id="email-format-group">      
      <fieldset>
        <legend>Choose an email format:</legend>
  
        <input type="radio" id="html" name="email-format" value="html">
        <label for="html">HTML</label>
  
        <input type="radio" id="text" name="email-format" value="text">
        <label for="text">Text</label>
      </fieldset>
    </div>

    <div id="submit-button-group">      
      <button type="submit">Submit</button>
    </div>
  </form>
</body>
</html>
