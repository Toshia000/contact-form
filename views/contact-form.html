<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <link rel="icon" href="images/favicon.svg">
</head>
<body>
  <form action="#" method="get">
    <h1>Contact Form</h1>

    <label for="first-name">First Name</label>
    <input type="text" id="first-name" name="first-name">

    <label for="last-name">Last Name</label>
    <input type="text" id="last-name" name="last-name">

    <label for="job-title">Job Title</label>
    <input type="text" id="job-title" name="job-title">

    <label for="company">Company</label>
    <input type="text" id="company" name="company">

    <label for="linkedin">LinkedIn URL</label>
    <input type="url" id="linkedin" name="linkedin">

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email">

    <label for="first-contact-method">How did we meet?</label>
    <select name="first-contact-method" id="first-contact-method">
      <option value="none">Please select</option>
      <option value="in-person">In Person</option>
      <option value="personal-website">Personal Website</option>
      <option value="linkedin">LinkedIn</option>
    </select>

    <label for="other-contact-method">Other (please specify)</label>
    <input type="text" id="other-contact-method" name="other-contact-method">

    <label for="message">Message</label>
    <textarea id="message" name="message"></textarea>
  </form>
</body>
</html>
